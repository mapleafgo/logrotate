name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet -mod=readonly ./...
      - run: go test -mod=readonly -race ./...
      - name: Test upgrade and rollback
        working-directory: tests/migration
        env:
          GOWORK: "off"
        run: go test -mod=readonly -race -count=1 ./...
